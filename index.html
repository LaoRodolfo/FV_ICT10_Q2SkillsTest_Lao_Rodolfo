
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Periodic Table Information Finder/Skills Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #e8f0ff, #d5e4fa);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .main-container {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #244b80;
            font-weight: 700;
            font-size: 27px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .element-icon {
            background-color: #e8f0ff;
            color: #244b80;
            width: 75px;
            height: 75px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 700;
            margin: 0 auto 15px;
        }

        .form-label {
            font-weight: 600;
            color: #344563;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-search {
            background-color: #315b96;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            border: none;
            cursor: pointer;
        }

        .btn-search:hover {
            background-color: #244575;
            color: white;
        }

        .result-container {
            background-color: #f5f8fd;
            border-radius: 15px;
            padding: 22px;
            margin-top: 25px;
        }

        .result-container h4 {
            color: #244b80;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #dce5f1;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #64748b;
            font-weight: 500;
        }

        .result-value {
            color: #244b80;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 25px;
            font-weight: 500;
        }

        .footer-divider {
            color: #315b96;
            margin: 0 8px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="main-container">

        <div class="header">

            <div class="element-icon">
                PT
            </div>

            <h1>Periodic Table Finder</h1>

            <p>Discover information about non-metal elements!</p>

        </div>

        <div class="mb-3">

            <label for="Element1" class="form-label">
                Element Symbol
            </label>

            <input
                type="text"
                class="form-control"
                id="Element1"
                placeholder="Enter symbol (e.g., O, H, Ne)"
            >

        </div>

        <button
            type="button"
            class="btn btn-search"
            py-click="search_element"
        >
            Search Element
        </button>

        <div class="result-container">

            <h4>Element Information</h4>

            <div class="result-item">
                <span class="result-label">Element Symbol</span>
                <span class="result-value" id="symbol_result">---</span>
            </div>

            <div class="result-item">
                <span class="result-label">Element Name</span>
                <span class="result-value" id="name_result">---</span>
            </div>

            <div class="result-item">
                <span class="result-label">Atomic Number</span>
                <span class="result-value" id="number_result">---</span>
            </div>

            <div class="result-item">
                <span class="result-label">Atomic Mass</span>
                <span class="result-value" id="mass_result">---</span>
            </div>

        </div>

        <div class="footer">
            By Rodolfo C. Lao III
            <span class="footer-divider"> | </span>
            10-Ruby
        </div>

    </div>

    <script type="py" src="main.py"></script>

</body>

</html>
